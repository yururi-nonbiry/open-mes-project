services:
  db:
    build: ./db/image
    container_name: prod_db
    # .env の START_DB で起動するかどうかを切り替えます (1: 起動する, 0: 起動しない)
    scale: ${START_DB:-1}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env # DB設定はこちらを参照
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d open_mes"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: prod_backend
    build:
      context: ./backend/image
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn base.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend/src:/open_mes
      - static_volume:/open_mes/staticfiles
    env_file:
      - .env # Django設定はこちらを参照
    environment:
      # nginx が付ける X-Real-IP をアクセス元IPとして使う(backend はポートを公開せず、nginx 経由でのみ届くため)
      - TRUST_X_REAL_IP=${TRUST_X_REAL_IP:-True}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/base/health/"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    container_name: prod_worker
    build:
      context: ./backend/image
      dockerfile: Dockerfile
    command: celery -A base worker -l info --concurrency=1
    volumes:
      - ./backend/src:/open_mes
    env_file:
      - .env # Django設定はこちらを参照
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  reverse-proxy:
    build: ./reverse-proxy_prod
    container_name: prod_reverse_proxy
    # .env の START_NGINX で起動するかどうかを切り替えます (1: 起動する, 0: 起動しない)
    scale: ${START_NGINX:-1}
    ports:
      # 前段にホストの nginx を置く場合は .env で NGINX_BIND=127.0.0.1、NGINX_PORT=8080 などとし、
      # 外部から直接つながらないようにします
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_PORT:-80}:80"
      # - "443:443" # SSL化する際に有効化します
    environment:
      # X-Real-IP を信頼する前段プロキシのアドレス(CIDR可)。既定値では信頼しない
      - NGINX_REAL_IP_FROM=${NGINX_REAL_IP_FROM:-127.0.0.1}
    restart: always
    volumes:
      # Djangoの静的ファイル (adminなど)
      - static_volume:/var/www/backend/static:ro
      # Reactのビルド済み静的ファイル (事前に 'npm run build' が必要)
      - ./frontend/dist:/var/www/frontend:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
